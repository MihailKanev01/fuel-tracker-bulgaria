name: Stage 7 validation
on:
  push:
    branches:
      - feature/stage-7-routing
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npx next build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fuel_tracker
          COLLECTOR_SECRET: test
          CRON_SECRET: test
          ADMIN_USER: admin
          ADMIN_PASSWORD: test
