name: Revert Stage 10 validation
on:
  push:
    branches:
      - revert/stage-10-ui-ux
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npx next build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fuel_tracker
          COLLECTOR_SECRET: test
          CRON_SECRET: test
          ADMIN_USER: admin
          ADMIN_PASSWORD: test
