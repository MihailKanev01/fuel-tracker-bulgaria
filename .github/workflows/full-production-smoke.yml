name: Full production smoke test
on:
  push:
    branches:
      - test/full-production-smoke-2026-09-29
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run production smoke tests
        shell: bash
        run: |
          node - <<'NODE'
          const BASE = "https://fuel-tracker-bulgaria.vercel.app";
          let failures = 0;
          const results = [];

          async function request(path, options = {}) {
            const res = await fetch(BASE + path, {
              redirect: "manual",
              ...options,
              headers: {
                accept: "application/json, text/html",
                ...(options.body ? {"content-type": "application/json"} : {}),
                ...(options.headers || {}),
              },
            });
            const body = await res.text();
            let json = null;
            try { json = JSON.parse(body); } catch {}
            return { status: res.status, body, json };
          }

          function test(name, ok, detail = "") {
            results.push({name, ok, detail});
            console.log((ok ? "PASS " : "FAIL ") + name + (detail ? " — " + detail : ""));
            if (!ok) failures++;
          }

          const home = await request("/");
          test("homepage 200", home.status === 200, "HTTP " + home.status);
          test("homepage title", home.body.includes("Fuel Tracker Bulgaria"));
          test("homepage average price text", home.body.includes("СРЕДНА ЦЕНА"));

          for (const fuel of ["diesel","a95","a100","lpg","cng"]) {
            const r = await request("/api/fuels/" + fuel);
            test("fuel " + fuel + " 200", r.status === 200 && typeof r.json?.average === "number", "HTTP " + r.status);
            const h = await request("/api/fuels/" + fuel + "/history?days=30");
            test("history " + fuel + " 200 + rows", h.status === 200 && Array.isArray(h.json) && h.json.length > 0, "rows=" + (Array.isArray(h.json) ? h.json.length : -1));
            const f = await request("/api/fuels/" + fuel + "/forecast");
            test("forecast " + fuel + " 200 + points", f.status === 200 && Array.isArray(f.json?.points) && f.json.points.length >= 7, "HTTP " + f.status);
          }

          for (const path of ["/api/prices/latest","/api/prices/cheapest?limit=5","/api/prices/changes?fuel=diesel","/api/prices/changes?fuel=a95","/api/stations","/api/news","/api/news/summary","/api/market-data"]) {
            const r = await request(path);
            test(path + " 200", r.status === 200, "HTTP " + r.status);
          }

          const stations = await request("/api/stations");
          const stationId = stations.json?.[0]?.id;
          test("station list has usable id", typeof stationId === "string" && stationId.length > 0);

          if (stationId) {
            const detail = await request("/api/stations/" + encodeURIComponent(stationId));
            const history = await request("/api/stations/" + encodeURIComponent(stationId) + "/history?fuel=diesel&days=30");
            test("station detail 200", detail.status === 200 && detail.json?.id === stationId, "HTTP " + detail.status);
            test("station history 200", history.status === 200 && Array.isArray(history.json) && history.json.length > 0, "rows=" + (Array.isArray(history.json) ? history.json.length : -1));
          }

          const nearby = await request("/api/prices/nearby?lat=43.2141&lon=27.9147&radius=10&limit=10&fuel=diesel");
          test("nearby Varna 200 + stations", nearby.status === 200 && Array.isArray(nearby.json) && nearby.json.length > 0, "rows=" + (Array.isArray(nearby.json) ? nearby.json.length : -1));

          const badNearby = await request("/api/prices/nearby?lat=99&lon=999&radius=10&limit=10&fuel=diesel");
          test("nearby invalid coords 400", badNearby.status === 400, "HTTP " + badNearby.status);

          const badFuel = await request("/api/prices/changes?fuel=nope");
          test("invalid fuel 400", badFuel.status === 400, "HTTP " + badFuel.status);

          for (const path of ["/api/geocode","/api/route","/api/routing","/api/trip"]) {
            const r = await request(path);
            test(path + " GET 405", r.status === 405, "HTTP " + r.status);
          }

          const geoBad = await request("/api/geocode", {method:"POST",body:JSON.stringify({query:""})});
          test("geocode empty 400", geoBad.status === 400, "HTTP " + geoBad.status);

          const geoGood = await request("/api/geocode", {method:"POST",body:JSON.stringify({query:"Варна"})});
          test("geocode Varna 200 + result", geoGood.status === 200 && Array.isArray(geoGood.json?.results) && geoGood.json.results.length > 0, "HTTP " + geoGood.status);

          const routeBad = await request("/api/route", {method:"POST",body:JSON.stringify({origin:{lat:99,lon:0},destination:{lat:43,lon:28}})});
          test("detailed route invalid 400", routeBad.status === 400, "HTTP " + routeBad.status);

          const routeGood = await request("/api/route", {method:"POST",body:JSON.stringify({origin:{lat:43.2141,lon:27.9147},destination:{lat:43.2332,lon:27.9134}})});
          test("detailed route live POST 200", routeGood.status === 200 && typeof routeGood.json?.distanceKm === "number" && Array.isArray(routeGood.json?.geometry) && routeGood.json.geometry.length > 1, "HTTP " + routeGood.status);

          const routingBad = await request("/api/routing", {method:"POST",body:JSON.stringify({origin:{lat:99,lon:0},destinations:[]})});
          test("routing invalid 400", routingBad.status === 400, "HTTP " + routingBad.status);

          const routingGood = await request("/api/routing", {method:"POST",body:JSON.stringify({origin:{lat:43.2141,lon:27.9147},destinations:[{id:"smoke-test",lat:43.2332,lon:27.9134}]})});
          test("routing live POST 200", routingGood.status === 200 && Array.isArray(routingGood.json?.routes) && routingGood.json.routes.length === 1, "HTTP " + routingGood.status);

          const tripBad = await request("/api/trip", {method:"POST",body:JSON.stringify({origin:{lat:43,lon:28}})});
          test("trip invalid 400", tripBad.status === 400, "HTTP " + tripBad.status);

          const tripGood = await request("/api/trip", {method:"POST",body:JSON.stringify({origin:{lat:43.2141,lon:27.9147},destination:{lat:43.242,lon:27.82},fuel:"diesel",quantity:20,consumption:7})});
          test("trip live POST 200", tripGood.status === 200 && tripGood.json?.baseRoute && Array.isArray(tripGood.json?.alternatives), "HTTP " + tripGood.status + " alternatives=" + (tripGood.json?.alternatives?.length ?? -1));

          const userKey = "11111111-1111-4111-8111-111111111111";
          const alertBad = await request("/api/alerts", {method:"POST",body:JSON.stringify({kind:"NOPE",fuelType:"DIESEL",threshold:1,stationId:stationId || ""})});
          test("alerts invalid 400", alertBad.status === 400, "HTTP " + alertBad.status);

          if (stationId) {
            const created = await request("/api/alerts", {method:"POST",headers:{"x-fueltracker-user-key":userKey},body:JSON.stringify({kind:"PRICE_BELOW",fuelType:"DIESEL",threshold:3.5,stationId})});
            const createdId = created.json?.id;
            test("alerts create 201", created.status === 201 && typeof createdId === "string", "HTTP " + created.status);
            const listed = await request("/api/alerts",{headers:{"x-fueltracker-user-key":userKey}});
            test("alerts list 200", listed.status === 200 && Array.isArray(listed.json), "HTTP " + listed.status);
            if (createdId) {
              const removed = await request("/api/alerts/" + encodeURIComponent(createdId), {method:"DELETE",headers:{"x-fueltracker-user-key":userKey}});
              test("alerts delete 200", removed.status === 200 && removed.json?.ok === true, "HTTP " + removed.status);
            }
          }

          for (const path of ["/api/debug/db","/api/admin/sources","/admin","/api/cron/collect"]) {
            const r = await request(path);
            const expected = path === "/api/debug/db" ? 404 : 401;
            test(path + " auth/security status", r.status === expected, "HTTP " + r.status);
          }

          const collect = await request("/api/collect",{method:"POST",body:JSON.stringify({})});
          test("/api/collect auth status", collect.status === 401, "HTTP " + collect.status);

          console.log(JSON.stringify({failures, results}, null, 2));
          process.exit(failures ? 1 : 0);
          NODE
